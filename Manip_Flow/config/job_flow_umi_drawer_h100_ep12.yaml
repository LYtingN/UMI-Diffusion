config_version: 1
cluster: aliyun_h100
num_gpus: 8
image: "ai-base:ubuntu22.04-sim5.0.0-lab_MD2.2.1-ray2.52.0-cu12.8_devel-v1.4"

git_workspace:
  token: GH_PAT
  repos:
    - repo_url: https://github.com/LYtingN/UMI-Diffusion.git
      commit_sha: main

pip_packages:
  # numpy 必须钉在镜像 base env 自带的 1.26.0。不钉的话 imagecodecs 会解析到
  # 2026.3.6(requires numpy>=2),把 numpy 2.x 装进 runtime_env 的 overlay venv
  # 并遮蔽 base 的 1.26.0 —— 结果 torch/ray/hydra 从 base 加载(numpy/core),
  # accelerate/imagecodecs 从 overlay 加载(numpy/_core),同一进程两套 numpy ABI。
  # 钉住 numpy 后 pip 会自行挑兼容版本(实测可解析:accelerate 1.14.0 /
  # diffusers 0.39.0 / timm 1.0.28 / dill 0.4.1)。
  - numpy==1.26.0
  - dill
  # zarr 必须 <3:replay_buffer.py / umi_dataset.py 用的是 zarr v2 的
  # DirectoryStore / ZipStore / LMDBStore,zarr 3 已把它们移除
  - zarr==2.18.7
  - numcodecs==0.15.1
  # zarr.LMDBStore 的后端(task.dataset.cache_dir 走的就是 LMDB);缺它会在
  # 建缓存时 ModuleNotFoundError
  - lmdb==2.3.0
  - timm
  - diffusers
  - accelerate
  - wandb>=0.18.0
  # rgb 反序列化的热路径(每个 chunk 一张 JPEG-XL)。2026.1.14 是最后一个还兼容
  # numpy 1.x 的版本,2026.3.6 起要求 numpy>=2
  - imagecodecs==2026.1.14
  # 仅 LeRobotUmiDataset 这条路需要;base env 已自带,pip 实际不会重装
  - pandas
  - imageio[ffmpeg]
pip_directories: []
py_modules: []
# repo 根下直接是 Manip_Flow/(train_flow_umi.py 里 _REPO_ROOT=parents[2] 已自行
# 将 repo 根插入 sys.path 以解析 Manip_Flow.* 的 hydra target),故 py_paths 指向 repo 根
py_paths: ["."]
log_folder: "logs"

# 相对 job_flow_umi_drawer_h100.yaml 的唯一变化:num_epochs 40 -> 12。
#
# 依据(0807 那次 40-epoch run,ckpt/flow_humi_unet_dino_drawer_a40_0807):
#   val_loss 在 epoch 10 见底 0.0481,之后单调上升到 epoch 38 的 0.0857(1.8x),
#   而 lr 那时已退火到 4.3e-07 —— 退火没能抵消过拟合。train_loss 同期从
#   0.0406 降到 0.0197,是纯记忆化。
# 所以把 cosine 的总预算压到 12 epoch,让 lr 在 val 仍在下降的区间内退完,
# 而不是在 val 已经变差的区间里继续退。这是单变量改动,便于和 0807 直接对比。
#
# 下一步的正交杠杆(本文件不动,留给后续 A/B):
#   optimizer.weight_decay=1e-2       (当前 1e-6,基本等于关闭)
#   policy.obs_encoder.finetune_last_n_blocks=0  (当前 1,完全冻结做对比)
tasks:
  - name: flow_umi_pnp
    type: torch_trainer.train
    run_name: flow_humi_unet_dino_drawer_a40_ep12
    entry_module: Manip_Flow/scripts/train_flow_umi.py
    args:
      - "--config-name"
      - "train_flow_unet_humi_lerobot_umi_pnp"

      - "policy.obs_encoder.share_rgb_model=False"
      - "task.dataset._target_=Manip_Flow.dataset.umi_dataset.UmiDataset"
      - "task.dataset_path=/data/nas_ray/home/eason.er/datasets/drawer_pooled_0807.zarr.zip"
      # cache_dir 必须落节点本地盘(不能是 /data/nas_ray:LMDB 走 NFS mmap 不可靠)。
      # UmiDataset 已实现 FileLock + LMDB:同 pod 的 8 个 rank 只有 1 个构建缓存,
      # 其余以 readonly mmap 打开,共享 page cache(≈6 GiB/节点)。
      - "task.dataset.cache_dir=/tmp/umi_zarr_cache"
      - "logging.mode=offline"
      - "hydra.run.dir=/data/nas_ray/home/eason.er/ckpt/flow_humi_unet_dino_drawer_a40_0807_ep12"
      - "dataloader.batch_size=16"
      - "val_dataloader.batch_size=16"
      - "training.num_epochs=12"
      - "training.lr_warmup_steps=500"
      - "training.checkpoint_every=2"
      - "training.val_every=2"
      # 12 epochs / val_every=2 = 6 次验证,k=6 等于全留
      - "checkpoint.topk.k=6"

os_env_vars:
  GH_PAT: "REPLACE_WITH_GITHUB_PAT"
  WANDB_MODE: "offline"
  UMI_PNP_DATASET_PATH: "/data/nas_ray/home/eason.er/datasets/drawer"
  HF_HOME: "/data/nas_ray/home/eason.er/hf_cache"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
