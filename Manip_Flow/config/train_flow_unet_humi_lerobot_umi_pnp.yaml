defaults:
  - task: umi_bimanual
  - _self_

name: train_flow_unet_humi_dinov3
_target_: Manip_Flow.workspace.train_diffusion_unet_image_workspace.TrainDiffusionUnetImageWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "humi_unet_dinov3_dual_100demos"

task:
  dataset_frequency: 30.0
  # 10 Hz policy cadence. Horizon 40 spans 3.9 s and covers the H8/F32/P2
  # Motion Prior's 104-frame condition window after resampling to 30 Hz.
  obs_down_sample_steps: 3
  low_dim_obs_horizon: 3
  img_obs_horizon: 1
  action_horizon: 40
  dataset_path: ${oc.env:UMI_PNP_DATASET_PATH}
  dataset:
    _target_: Manip_Flow.dataset.lerobot_umi_dataset.LeRobotUmiDataset
    shape_meta: ${task.shape_meta}
    dataset_path: ${task.dataset_path}
    cache_dir: null
    pose_repr: ${task.pose_repr}
    action_padding: False
    temporally_independent_normalization: False
    repeat_frame_prob: 0.0
    seed: 42
    val_ratio: 0.10

policy:
  _target_: Manip_Flow.policy.flow_timm_policy.FlowTimmPolicy
  shape_meta: ${shape_meta}

  obs_encoder:
    _target_: Manip_Flow.model.vision.timm_obs_encoder.TimmObsEncoder
    shape_meta: ${shape_meta}
    model_name: 'vit_base_patch16_dinov3.lvd1689m'
    pretrained: True
    frozen: False
    finetune_last_n_blocks: 1
    global_pool: ''
    feature_aggregation: 'attention_pool_2d'
    position_encording: 'sinusoidal'
    downsample_ratio: 32
    transforms:
      # 0.95 crops 224 -> 212, too weak to stop the policy memorizing absolute
      # positions. Note torchvision RandomCrop draws ONE crop per call, i.e. per
      # (batch, camera), not per sample -- so the strength per draw matters more
      # than it would with per-sample augmentation.
      - type: RandomCrop
        ratio: 0.88
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.3
        contrast: 0.4
        saturation: 0.5
        hue: 0.08
    use_group_norm: True
    share_rgb_model: False
    normalize_rgb: True

  num_inference_steps: 8
  time_embed_scale: 1.0
  time_sample: uniform
  logit_normal_mean: 0.0
  logit_normal_std: 1.0
  # 4 flow samples per obs-encoder forward. The two ViT-B towers are ~90% of the
  # step cost (171M vs 18M), so this buys 4x the velocity-field supervision for
  # ~1.15x the time, and lower velocity-estimate variance is directly lower
  # sampling dispersion at deploy.
  train_flow_n_samples: 4
  obs_as_global_cond: True
  rtc_execution_horizon: 20
  rtc_max_guidance_weight: 5.0
  rtc_prefix_schedule: exp

  # ConditionalUnet1D builds a Linear(128 + global_cond -> 2*out_ch) in EVERY
  # residual block, so the raw 1650-dim feature costs 9.56M of the 18.30M UNet on
  # FiLM projection alone. Projecting once to 256 first drops that to 2.07M with
  # the temporal convolutions untouched. FlowDiT1D already bottlenecks internally.
  cond_bottleneck_dim: 256
  # Classifier-free guidance. cond_dropout_prob trains the unconditional branch
  # (and is itself a strong regularizer); cfg_scale > 1 at inference sharpens the
  # sample toward the observation, which is the direct lever on the chunk-end
  # multimodality. Kept at 1.0 here -- raise it on the deploy side once a
  # checkpoint has actually been trained with dropout > 0.
  cond_dropout_prob: 0.1
  cfg_scale: 1.0
  # Deploy commits ~11 of the 40 action tokens per replan and RTC carries
  # rtc_execution_horizon=20, so tokens past 20 are neither executed nor
  # predictable from a single frame -- yet with uniform weights they take half the
  # loss and half of val_loss. Weight 1.0 through token 20, then linear to 0.25.
  # Renormalized to mean 1.0, so val_loss keeps its magnitude but is NOT
  # comparable to runs with different weights.
  loss_horizon_full_steps: 20
  loss_horizon_tail_weight: 0.25

  backbone: unet
  diffusion_step_embed_dim: 128
  down_dims: [96, 192, 384]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True
  unet_time_log_scale: 10.0

ema:
  _target_: Manip_Flow.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 32
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 32
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  # 1e-6 is decay switched off in all but name. The pretrained ViT blocks are
  # protected by their own 0.1x lr group (see the workspace), so the decay lands
  # mostly where it should: the randomly-initialized pool head, cond_proj and the
  # velocity model.
  # NOTE the coupling with lr: AdamW's decoupled decay shrinks weights by
  # lr * weight_decay per step, so dropping lr 3e-4 -> 1e-4 also weakens the
  # regularization 3x (3e-6 -> 1e-6 per step). If lr was lowered to fight
  # overfitting, this is pulling the other way.
  weight_decay: 1.0e-2

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  lr_scheduler: cosine
  lr_warmup_steps: 2000
  num_epochs: 100
  gradient_accumulate_every: 1
  use_ema: True
  freeze_encoder: False
  rollout_every: 10
  checkpoint_every: 10
  val_every: 5
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  # val_loss alone cannot see the failure that matters at deploy: it scores the
  # conditional MEAN velocity field at uniform t, averaged over all
  # action_horizon x action_dim entries. These add, on the val split:
  #   val_loss_raw           -- same loss on the non-EMA weights (the number the
  #                             pre-2026-08-08 runs logged as val_loss)
  #   val_loss_shuffled_obs  -- obs paired to another sample's action, i.e. the
  #                             "conditioning is uninformative" reference that
  #                             gives val_loss a scale
  #   val_draw_std_*         -- spread over val_draw_k independent draws from one
  #                             observation, in metres of EE displacement
  #   val_prefix_tail_*      -- how far a fresh draw departs from a chunk it was
  #                             already RTC-committed to, in metres
  # Costs roughly 2x the validation pass plus (val_draw_k + 2) extra sampling
  # forwards on one batch. Set False for the cheap path.
  val_diagnostics: True
  val_draw_k: 8
  val_draw_n_obs: 4

logging:
  project: umi_flow
  resume: False
  mode: disabled
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    # select on val_loss, not train_loss: with ~190 episodes train_loss keeps
    # dropping while the policy overfits, so topk-by-train_loss would retain
    # exactly the most overfit checkpoints. INVARIANT: val_every must divide
    # checkpoint_every, otherwise val_loss is missing on checkpoint epochs and
    # topk is skipped (see the guard in the workspace).
    monitor_key: val_loss
    mode: min
    k: 20
    format_str: 'epoch={epoch:04d}-val_loss={val_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
