# Flow-matching variant of UMI's train_diffusion_unet_umi_bimanual_workspace.
# Same task (umi_bimanual, resolved from the LOCAL vendored config/task/),
# same workspace/trainer, same obs encoder; the policy head is rectified flow
# with a DiT-1D backbone.
#
# FRAME-BUDGET CONTRACT with the Prior_Recon online planner (delta87+lookahead
# checkpoints: hist 2 + 4x8 future = seg_len 34, lookahead 16, 30 fps).
#
# The receding-horizon loop (the ORIGINAL design this stack was built for):
# generate one chunk -> planner consumes it as the kp window -> execute
# `stride` new frames -> replan. Per-primitive lookahead previews only need
# to be complete for the primitives that get EXECUTED; later primitives'
# previews are look_valid-truncated -- exactly the case the prior's training
# randomly truncates previews for. Requirement:
#
#   provider frames @30fps >= max(seg_len 34, stride + hist 2 + lookahead 16)
#   chunk frames = floor((Ta-1) / action_fps * 30) + 1
#   provider frames = hist + chunk frames - 1
#   action_fps = capture fps / obs_down_sample_steps
#
#   stride 16 (execute prims 0-1, both with FULL 16-frame previews): 34 frames
#   stride 32 (execute the whole segment):                           50 frames
#   < 34 frames is always a hard error: recon_delta69 ZERO-pads a short EE
#   condition window (garbage pose, amplified by delta87 EE-column pinning).
#
# The constraint is chunk DURATION, not token count (dp_adapter resamples to
# 30 fps; UMI itself downsamples to ~20 Hz). 30 fps data, down_sample 3:
#   horizon 12 -> 1.10 s -> 34 raw / 35 provider frames
#       (DEFAULT: execute 16, replan; executed prims fully previewed)
#   horizon 17 -> 1.60 s -> 49 raw / 50 provider frames
#       (full preview for all 4 prims; stride=32; 17 % 4 != 0 -> DiT only)
defaults:
  - task: umi_bimanual
  - _self_

name: train_flow_dit_timm
_target_: Manip_Flow.workspace.train_diffusion_unet_image_workspace.TrainDiffusionUnetImageWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

# planner-matched chunk (see frame-budget contract above); assumes 30 fps
# capture and replan stride <= 16. For other capture rates / strides keep
# provider frames >= max(34, stride+18); adjust horizon/down-sample together.
task:
  action_horizon: 12
  obs_down_sample_steps: 3

n_action_steps: 8

policy:
  _target_: Manip_Flow.policy.flow_timm_policy.FlowTimmPolicy

  shape_meta: ${shape_meta}

  obs_encoder:
    _target_: Manip_Flow.model.vision.timm_obs_encoder.TimmObsEncoder
    shape_meta: ${shape_meta}

    # DINOv3 ViT-B/16, finetuned (pretrained weights, NOT frozen).
    # VERIFY the exact timm tag on the training box before the first run:
    #   python -c "import timm; print(timm.list_models('*dinov3*', pretrained=True))"
    # (needs timm >= 1.0.20; DINOv3 HF weights are gated -- accept the license +
    #  `huggingface-cli login` first.) Base variant is 768-d, same width as the
    #  old CLIP ViT, so the DiT global_cond_dim auto-adjusts either way.
    model_name: 'vit_base_patch16_dinov3.lvd1689m'
    pretrained: True
    frozen: False              # finetune the backbone end-to-end

    global_pool: ''
    # NOTE: model_name.startswith('vit') -> TimmObsEncoder forces the CLS-token
    # path and IGNORES the three settings below (same as the old CLIP ViT did).
    # They are kept only so a non-vit backbone could be dropped back in later.
    feature_aggregation: 'attention_pool_2d'
    position_encording: 'sinusoidal'
    downsample_ratio: 32

    transforms:
      - type: RandomCrop
        ratio: 0.95
      - _target_: torchvision.transforms.RandomRotation
        degrees:
          - -5.0
          - 5.0
        expand: false
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.3
        contrast: 0.4
        saturation: 0.5
        hue: 0.08

    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  # flow-matching head (replaces noise_scheduler + input_pertub)
  num_inference_steps: 8      # Euler steps at inference; 4-8 usually suffices
  time_embed_scale: 1000.0    # t in [0,1] scaled for the sinusoidal step embed
  time_sample: uniform        # or logit_normal (SD3-style mid-path emphasis)
  logit_normal_mean: 0.0
  logit_normal_std: 1.0
  train_flow_n_samples: 1

  obs_as_global_cond: True

  # velocity-field backbone
  backbone: dit               # 'dit' (default; matches the transformer+flow
                              # lower level, horizon-agnostic) or 'unet' (UMI
                              # parity; needs horizon % 4 == 0 -- 12 qualifies)
  dit_d_model: 512
  dit_depth: 6
  dit_n_heads: 8
  dit_mlp_ratio: 4.0
  dit_dropout: 0.0

  # unet backbone params (used only when backbone: unet)
  diffusion_step_embed_dim: 128
  down_dims: [256,512,1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True

ema:
  _target_: Manip_Flow.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 32
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 32
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  lr_scheduler: cosine
  lr_warmup_steps: 2000
  num_epochs: 100
  gradient_accumulate_every: 1
  # EMA destroys performance when used with BatchNorm
  # replace BatchNorm with GroupNorm.
  use_ema: True
  freeze_encoder: False
  rollout_every: 10
  checkpoint_every: 10
  val_every: 5
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: umi_flow
  resume: False
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 20
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
